<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" rx="20" fill="#F0F9FF" />
  <text x="200" y="35" font-family="sans-serif" font-weight="bold" font-size="18" fill="#0369A1" text-anchor="middle">Angle Classifications</text>

  <!-- Right Angle (90) -->
  <g transform="translate(40, 60)">
    <line x1="10" y1="90" x2="80" y2="90" stroke="#0284C7" stroke-width="3" />
    <line x1="10" y1="90" x2="10" y2="20" stroke="#0284C7" stroke-width="3" />
    <rect x="10" y="75" width="15" height="15" fill="none" stroke="#F59E0B" stroke-width="2" />
    <text x="45" y="115" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0C4A6E" text-anchor="middle">Right (90°)</text>
  </g>

  <!-- Acute Angle (<90) -->
  <g transform="translate(160, 60)">
    <line x1="10" y1="90" x2="80" y2="90" stroke="#0284C7" stroke-width="3" />
    <line x1="10" y1="90" x2="60" y2="35" stroke="#0284C7" stroke-width="3" />
    <path d="M30,90 A25,25 0 0,0 23,73" fill="none" stroke="#F59E0B" stroke-width="2" />
    <text x="45" y="115" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0C4A6E" text-anchor="middle">Acute (&lt;90°)</text>
  </g>

  <!-- Obtuse Angle (>90) -->
  <g transform="translate(280, 60)">
    <line x1="40" y1="90" x2="100" y2="90" stroke="#0284C7" stroke-width="3" />
    <line x1="40" y1="90" x2="5" y2="35" stroke="#0284C7" stroke-width="3" />
    <path d="M60,90 A20,20 0 0,0 25,70" fill="none" stroke="#F59E0B" stroke-width="2" />
    <text x="50" y="115" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0C4A6E" text-anchor="middle">Obtuse (&gt;90°)</text>
  </g>

  <rect x="80" y="165" width="240" height="30" rx="8" fill="#E0F2FE" />
  <text x="200" y="185" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0369A1" text-anchor="middle">Triangle Interior Sum = Always 180°</text>
</svg>
