<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#ECFDF5" />
  <text x="200" y="35" font-family="sans-serif" font-weight="bold" font-size="18" fill="#065F46" text-anchor="middle">Area = Length × Width</text>
  
  <!-- 4 x 3 Grid -->
  <g transform="translate(100, 60)">
    <!-- 12 Unit squares -->
    <rect x="0" y="0" width="200" height="120" fill="#A7F3D0" stroke="#059669" stroke-width="4" />
    <line x1="50" y1="0" x2="50" y2="120" stroke="#059669" stroke-width="2" />
    <line x1="100" y1="0" x2="100" y2="120" stroke="#059669" stroke-width="2" />
    <line x1="150" y1="0" x2="150" y2="120" stroke="#059669" stroke-width="2" />
    
    <line x1="0" y1="40" x2="200" y2="40" stroke="#059669" stroke-width="2" />
    <line x1="0" y1="80" x2="200" y2="80" stroke="#059669" stroke-width="2" />
    
    <!-- Top label: Length 4 -->
    <text x="100" y="-10" font-family="sans-serif" font-weight="bold" font-size="13" fill="#047857" text-anchor="middle">Length = 4 units</text>
    <!-- Left label: Width 3 -->
    <text x="-12" y="65" font-family="sans-serif" font-weight="bold" font-size="13" fill="#047857" text-anchor="middle" transform="rotate(-90 -12 65)">Width = 3 units</text>
  </g>

  <rect x="70" y="200" width="260" height="28" rx="8" fill="#D1FAE5" />
  <text x="200" y="219" font-family="sans-serif" font-weight="bold" font-size="12" fill="#065F46" text-anchor="middle">Area = 4 × 3 = 12 unit squares</text>
</svg>
