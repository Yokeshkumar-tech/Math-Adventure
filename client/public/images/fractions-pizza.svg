<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="crust" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <radialGradient id="cheese" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="90%" stop-color="#FCD34D" />
    </radialGradient>
  </defs>
  
  <!-- Outer Plate -->
  <circle cx="200" cy="200" r="190" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" />
  
  <!-- Pizza Crust -->
  <circle cx="200" cy="200" r="170" fill="url(#crust)" stroke="#78350F" stroke-width="4" />
  
  <!-- Slices -->
  <!-- Slice 1 (Eaten / Shaded 1/4) -->
  <path d="M200,200 L200,40 A160,160 0 0,1 360,200 Z" fill="#F59E0B" stroke="#78350F" stroke-width="3" />
  <circle cx="270" cy="130" r="14" fill="#DC2626" />
  <circle cx="230" cy="100" r="10" fill="#DC2626" />
  <circle cx="300" cy="170" r="10" fill="#DC2626" />

  <!-- Slice 2 -->
  <path d="M200,200 L360,200 A160,160 0 0,1 200,360 Z" fill="#FEF3C7" stroke="#78350F" stroke-width="3" />
  <!-- Slice 3 -->
  <path d="M200,200 L200,360 A160,160 0 0,1 40,200 Z" fill="#FEF3C7" stroke="#78350F" stroke-width="3" />
  <!-- Slice 4 -->
  <path d="M200,200 L40,200 A160,160 0 0,1 200,40 Z" fill="#FEF3C7" stroke="#78350F" stroke-width="3" />
  
  <!-- Slice Divider Lines -->
  <line x1="200" y1="40" x2="200" y2="360" stroke="#78350F" stroke-width="3" />
  <line x1="40" y1="200" x2="360" y2="200" stroke="#78350F" stroke-width="3" />
  
  <!-- Center Marker -->
  <circle cx="200" cy="200" r="12" fill="#78350F" />
  
  <!-- Text Label -->
  <rect x="110" y="340" width="180" height="40" rx="12" fill="#4F46E5" />
  <text x="200" y="365" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">
    1 of 4 Slices = 1/4
  </text>
</svg>
